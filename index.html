<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adivinhe o Número</title>
</head>
<body>
    <h1>Adivinhe o Número</h1>
    <p>O computador escolheu um número. Consegue adivinhar?</p>
    <label for="difficulty">Escolha o nível de dificuldade:</label>
    <select name="" id="difficulty">
        <option value="easy">Fácil (1-50, 10 tentativas)</option>
        <option value="medium">Médio (1-100, 7 tentativas)</option>
        <option value="hard">Difícil (1-200, 5 tentativas)</option>
    </select>
    <input type="number" id="guess" placeholder="Digite seu palpite" />
    <button id="check">Verificar</button>
    <button id="reset" class="hidden">Recomeçar</button>

    <p id="feedback"></p>
    <p id="attempts"></p>
    <div class="attempts-list">
        <strong>Tentativas erradas:</strong>
        <span id="wrong-guesses">Nenhuma até agora!</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
